name: Repair exact ALCF-V2-0 p04 transport object

on:
  push:
    branches:
      - bootstrap/alcf-v2-exact-publish
    paths:
      - .github/workflows/alcf-v2-repair-p04.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/alcf-v2-exact-publish
      - name: Recover exact p04-r0-2 from resident redundant copies
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            c0c46114d58494c1e4d27829d827f86d20a821d75a5f834c5f0428a6139a2b91
            e1794a99ca968433db5a878662f52f29119f38290a61be864c760d2265815e25
            cab81177bd792401ebd77adb442f87577d7e9f46f9a077fd2c996a495de69be7
            bebc7b3b5569e4650e09129964a114dea8a4a06bf6a8fac2633f1fc811ed2f5b
          )
          : > /tmp/p04-r0-2.b64
          for i in 0 1 2 3; do
            found=''
            want=${expected[$i]}
            echo "SEARCH quarter=$i expected=$want"

            # candidate spec: file:canonical_offset:radius
            candidates=(
              ".bootstrap/p04-r0-2.b64:$((i*1000)):4"
              ".bootstrap/p04-r0-2-s$i.b64:0:4"
              ".bootstrap/part-04-04.b64:$((i*1000)):4"
              ".bootstrap/part-04.b64:$((16000+i*1000)):8"
              ".bootstrap/p04-r0.b64:$((8000+i*1000)):8"
            )

            for spec in "${candidates[@]}"; do
              IFS=: read -r src base radius <<< "$spec"
              size=$(wc -c < "$src")
              start=$((base-radius))
              [ "$start" -lt 0 ] && start=0
              end=$((base+radius))
              max_start=$((size-1000))
              [ "$end" -gt "$max_start" ] && end=$max_start
              [ "$end" -lt "$start" ] && continue
              for off in $(seq "$start" "$end"); do
                dd if="$src" of=/tmp/candidate bs=1 skip="$off" count=1000 status=none
                [ "$(wc -c < /tmp/candidate)" = "1000" ] || continue
                got=$(sha256sum /tmp/candidate | awk '{print $1}')
                if [ "$got" = "$want" ]; then
                  echo "EXACT quarter=$i source=$src offset=$off"
                  cat /tmp/candidate >> /tmp/p04-r0-2.b64
                  found=1
                  break 2
                fi
              done
            done

            if [ -z "$found" ]; then
              echo "NO_EXACT_COPY quarter=$i"
              exit 1
            fi
          done

          test "$(wc -c < /tmp/p04-r0-2.b64)" = "4000"
          echo '65c804454d0e3e11011fd7bc2a44e43f5be2af818fd9b486fbbc145b52751a8d  /tmp/p04-r0-2.b64' | sha256sum -c -
          cp /tmp/p04-r0-2.b64 .bootstrap/p04-r0-2.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .bootstrap/p04-r0-2.b64
          git commit -m 'Repair exact ALCF-V2-0 p04 transport object'
          git push origin HEAD:bootstrap/alcf-v2-exact-publish
