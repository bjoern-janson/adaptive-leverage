name: Diagnose ALCF-V2-0 part04 corrections

on:
  push:
    branches:
      - bootstrap/alcf-v2-exact-publish
    paths:
      - .github/workflows/alcf-v2-exact-publish.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/alcf-v2-exact-publish
      - name: Verify part04 correction files
        shell: bash
        run: |
          set -euo pipefail
          echo '84ee371a0983b9651ed7aad5846a98c57bce10520d417a631e5e50990f0fc85a  .bootstrap/p04-r0.b64' | sha256sum -c -
          echo 'be7b8015ee2d04e965d4b127b8116ac0d27958e178916260810ced2e3ddf4055  .bootstrap/p04-r1.b64' | sha256sum -c -
          echo 'ba11f47024968da24347e8b8e13b39214049c5469f6f5bb30ae7da69b289fa90  .bootstrap/p04-r2.b64' | sha256sum -c -
