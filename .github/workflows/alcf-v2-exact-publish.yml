name: Diagnose ALCF-V2-0 publication payload

on:
  push:
    branches:
      - bootstrap/alcf-v2-exact-publish
    paths:
      - .github/workflows/alcf-v2-exact-publish.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/alcf-v2-exact-publish
      - name: Hash staged payload segments
        shell: bash
        run: |
          set -euo pipefail
          for f in .bootstrap/part-04.b64 .bootstrap/part-05.b64 .bootstrap/tail-01.b64; do
            echo "FILE $f bytes=$(wc -c < "$f")"
            rm -f /tmp/seg-*
            split -b 4000 -d -a 2 "$f" /tmp/seg-
            i=0
            for s in /tmp/seg-*; do
              echo "SEG $f $i bytes=$(wc -c < "$s") sha256=$(sha256sum "$s" | awk '{print $1}')"
              i=$((i+1))
            done
          done
