name: Diagnose ALCF-V2-0 part04 corrections

on:
  push:
    branches:
      - bootstrap/alcf-v2-exact-publish
    paths:
      - .github/workflows/alcf-v2-exact-publish.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/alcf-v2-exact-publish
      - name: Report part04 correction identities
        shell: bash
        run: |
          set -euo pipefail
          for f in .bootstrap/p04-r0.b64 .bootstrap/p04-r1.b64 .bootstrap/p04-r2.b64; do
            echo "ACTUAL $f bytes=$(wc -c < "$f") sha256=$(sha256sum "$f" | awk '{print $1}')"
          done
